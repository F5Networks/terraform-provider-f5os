variables:
  DOCKER_HUB_PROXY: "artifactory.f5net.com/dockerhub-remote"
  PKG_NAME: terraform-provider-f5os

default:
  image: "${DOCKER_HUB_PROXY}/golang:1.25"

stages:
  - lint
  - Mend
  - unittest
  - acctest
  - schema-diff
  - release
  - publish

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - .gitlab/ci/Dockerfile
        - .go-version
      variables:
        IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

cache:
  key:
    files:
      - GNUMakefile

makelint:
  needs: []
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_ACC_TESTS == "only"
      when: never
    - when: on_success
  script:
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5
    - golangci-lint --version
    - export GOFLAGS=-mod=vendor
    - make ${TARGET}
  parallel:
    matrix:
      - TARGET:
          - lint

cve-scan:
  stage: lint
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_ACC_TESTS == "only"
      when: never
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - export GOFLAGS=-mod=vendor
    - govulncheck -show verbose ./...


# Run any dependency tasks before this to ensure you have installed all your dependencies
run-Mend:
  stage: Mend
  image: artifactory.f5net.com/f5-cedi-docker/sst/tc-mend
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_ACC_TESTS == "only"
      when: never
    - when: on_success
  script:
    - java -jar /opt/mend/wss-unified-agent.jar -noConfig true -wss.url https://f5.whitesourcesoftware.com/agent -apiKey ${WS_APIKEY_SANDBOX} -product "Eco - Terraform-Ansible" -project ${CI_PROJECT_PATH} -d .
  allow_failure: true

#run whitesource:
#  stage: whitesource
#  image: artifactory.f5net.com/f5-f5dev-docker/tc-whitesource
#  script: |
#    # Run any dependency tasks to ensure you have installed all your dependencies
#    # Ex: npm install
#    # You will need a Whitesource API key in your CI/CD variables. If you're working in an existing Gitlab group, you might already have one.
#    java -jar /opt/whitesource/wss-unified-agent.jar -noConfig true -wss.url https://f5.whitesourcesoftware.com/agent -apiKey ${WS_APIKEY_SANDBOX} -product "Eco - Terraform-Ansible" -project ${CI_PROJECT_PATH} -d .
#  allow_failure: true

unit-tests:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_ACC_TESTS == "only"
      when: never
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - "**/*.go"
        - go.mod
        - go.sum
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
  stage: unittest
  variables:
    # Pin the Terraform CLI used by the plugin-testing framework. Without a
    # Terraform binary on PATH the framework auto-downloads "latest" from
    # releases.hashicorp.com at test time, which is both non-deterministic
    # (version drifts away from the versions GitHub Actions tests against)
    # and fragile — a transient network failure reaching releases.hashicorp.com
    # fails the whole suite before any test runs (observed: EOF fetching
    # terraform/1.15.8/index.json). Pinning + pre-installing removes the
    # runtime download entirely.
    TF_VERSION: "1.9.8"
    # Override TERRAFORM_MIRROR (e.g. to an internal artifactory mirror) to
    # avoid depending on external releases.hashicorp.com reachability.
    TERRAFORM_MIRROR: "https://releases.hashicorp.com"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends unzip
    - curl -fsSL -o /tmp/terraform.zip
        "${TERRAFORM_MIRROR}/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
    - unzip -o /tmp/terraform.zip -d /usr/local/bin
    - rm -f /tmp/terraform.zip
    # Point the plugin-testing framework at the pinned binary so it never
    # attempts an on-the-fly download.
    - export TF_ACC_TERRAFORM_PATH="$(command -v terraform)"
    - terraform version
  script:
    - make test
    - go tool cover -func=cover.out > coverage_report.txt
    - tail -1 coverage_report.txt
    - ./scripts/check-coverage.sh cover.out 75
  coverage: '/Coverage: \d+\.\d+%/'
  artifacts:
    when: always
    paths:
      - cover.out
      - coverage_report.txt
    expire_in: 30 days

# ── Acceptance tests ───────────────────────────────────────────────────
# Acceptance tests hit a REAL, SHARED F5OS device (the DUT). They are slow,
# so they are split into one job per resource group and run STRICTLY
# SEQUENTIALLY — never in parallel — to avoid two jobs mutating the same
# device at once and colliding.
#
# Two mechanisms guarantee serial execution:
#   1. resource_group: f5os_acc_dut — a GitLab mutex. Only one job in this
#      group runs at a time, even across overlapping/concurrent pipelines.
#   2. needs: chain — each job needs the previous one, giving a deterministic
#      order within a single pipeline. Jobs are allow_failure:true, and a
#      failed-but-allowed job still counts as "completed" for needs, so a
#      flaky group does NOT block the groups after it.
#
# Triggering: scheduled pipelines only, and only when the DUT credentials
# (F5OS_HOST / F5OS_USERNAME / F5OS_PASSWORD) are present. Set these and a
# cron schedule under Settings > CI/CD > Pipeline schedules.
#
# To run a single group ad-hoc, trigger a pipeline with RUN_ACC_TESTS=true
# (and the F5OS_* creds) — the same rule allows manual scheduled-style runs.
#
# Selecting a single group: set the ACC_JOB variable to the group name
# (the suffix after "acc:" — e.g. ACC_JOB=dns, ACC_JOB=tenant_image). Only
# that group's job runs; every other acc:* job is skipped. Leave ACC_JOB
# unset/empty to run the full suite as before. Each job declares its own
# name in ACC_GROUP, and the rules below compare ACC_JOB against it.
.acc_test:
  stage: acctest
  resource_group: f5os_acc_dut
  rules:
    # When ACC_JOB is set, only run the job whose ACC_GROUP matches it.
    - if: $ACC_JOB && $ACC_JOB != $ACC_GROUP
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" && $F5OS_HOST && $F5OS_USERNAME && $F5OS_PASSWORD
    - if: $RUN_ACC_TESTS && $F5OS_HOST && $F5OS_USERNAME && $F5OS_PASSWORD
  variables:
    GOFLAGS: "-mod=vendor"
    TF_ACC: "1"
    # ACC_RUN is the -run regex selecting this group's TestAcc* functions.
    # Per-job timeout in minutes (Go test -timeout). Override per job as needed.
    ACC_TIMEOUT: "60m"
  script:
    - |
      if [ -z "${ACC_RUN}" ]; then
        echo "ERROR: ACC_RUN is not set. Each acc job must define it."
        exit 1
      fi
    - echo "Running acceptance group -run='${ACC_RUN}' (timeout ${ACC_TIMEOUT})"
    - |
      go test -v -parallel=1 -cover -timeout "${ACC_TIMEOUT}" \
        -coverprofile "cover_${CI_JOB_NAME_SLUG}.out" \
        -run "${ACC_RUN}" ./internal/provider/
    - |
      if [ -f "cover_${CI_JOB_NAME_SLUG}.out" ]; then
        go tool cover -func="cover_${CI_JOB_NAME_SLUG}.out" > "coverage_report_${CI_JOB_NAME_SLUG}.txt"
        COVERAGE=$(go tool cover -func="cover_${CI_JOB_NAME_SLUG}.out" | tail -1 | awk '{print $NF}' | tr -d '%')
        echo "coverage: ${COVERAGE}%"
      else
        echo "No coverage profile produced"
      fi
  coverage: '/coverage: \d+\.\d+/'
  artifacts:
    when: always
    paths:
      - cover_*.out
      - coverage_report_*.txt
    expire_in: 30 days
  allow_failure: true
  timeout: 75m  # 15m buffer over default ACC_TIMEOUT (60m); override in jobs with longer ACC_TIMEOUT

# The jobs below are ordered least-disruptive first, most-disruptive last.
# Each `needs` the previous job so they run one after another. The shared
# resource_group enforces the mutex even if ordering is bypassed.

acc:device_info:
  extends: .acc_test
  needs: []
  variables:
    ACC_GROUP: "device_info"
    ACC_RUN: "^TestAccDeviceInfo"
    ACC_TIMEOUT: "30m"

acc:vlan:
  extends: .acc_test
  needs:
    - job: acc:device_info
      optional: true
  variables:
    ACC_GROUP: "vlan"
    ACC_RUN: "^TestAccVlan"
    ACC_TIMEOUT: "30m"

acc:interface:
  extends: .acc_test
  needs:
    - job: acc:vlan
      optional: true
  variables:
    ACC_GROUP: "interface"
    ACC_RUN: "^TestAccInterface"
    ACC_TIMEOUT: "30m"

acc:lag:
  extends: .acc_test
  needs:
    - job: acc:interface
      optional: true
  variables:
    ACC_GROUP: "lag"
    ACC_RUN: "^TestAccLag"
    ACC_TIMEOUT: "30m"

acc:dns:
  extends: .acc_test
  needs:
    - job: acc:lag
      optional: true
  variables:
    ACC_GROUP: "dns"
    ACC_RUN: "^TestAcc(F5osDNS|DNS)"
    ACC_TIMEOUT: "30m"

acc:ntp:
  extends: .acc_test
  needs:
    - job: acc:dns
      optional: true
  variables:
    ACC_GROUP: "ntp"
    ACC_RUN: "^TestAcc(F5osNTP|NTP)"
    ACC_TIMEOUT: "30m"

acc:snmp:
  extends: .acc_test
  needs:
    - job: acc:ntp
      optional: true
  variables:
    ACC_GROUP: "snmp"
    ACC_RUN: "^TestAccSnmp"
    ACC_TIMEOUT: "45m"

acc:logging:
  extends: .acc_test
  needs:
    - job: acc:snmp
      optional: true
  variables:
    ACC_GROUP: "logging"
    ACC_RUN: "^TestAcc(F5osLogging|Logging)"
    ACC_TIMEOUT: "60m"

acc:tls_cert_key:
  extends: .acc_test
  needs:
    - job: acc:logging
      optional: true
  variables:
    ACC_GROUP: "tls_cert_key"
    ACC_RUN: "^TestAccTlsCertKey"
    ACC_TIMEOUT: "30m"

acc:primarykey:
  extends: .acc_test
  needs:
    - job: acc:tls_cert_key
      optional: true
  variables:
    ACC_GROUP: "primarykey"
    ACC_RUN: "^TestAccPrimaryKey"
    ACC_TIMEOUT: "45m"

acc:config_backup:
  extends: .acc_test
  needs:
    - job: acc:primarykey
      optional: true
  variables:
    ACC_GROUP: "config_backup"
    ACC_RUN: "^TestAccCfgBackup"
    ACC_TIMEOUT: "30m"

acc:license:
  extends: .acc_test
  needs:
    - job: acc:config_backup
      optional: true
  variables:
    ACC_GROUP: "license"
    ACC_RUN: "^TestAccLicense"
    ACC_TIMEOUT: "30m"

acc:qkview:
  extends: .acc_test
  needs:
    - job: acc:license
      optional: true
  variables:
    ACC_GROUP: "qkview"
    ACC_RUN: "^TestAccQkview"
    ACC_TIMEOUT: "60m"

acc:system:
  extends: .acc_test
  needs:
    - job: acc:qkview
      optional: true
  variables:
    ACC_GROUP: "system"
    ACC_RUN: "^TestAccSystem"
    ACC_TIMEOUT: "45m"

acc:tenant_image:
  extends: .acc_test
  needs:
    - job: acc:system
      optional: true
  variables:
    ACC_GROUP: "tenant_image"
    # Covers tenant_image resource AND data source (both TestAccTenantImage*).
    ACC_RUN: "^TestAccTenantImage"
    ACC_TIMEOUT: "120m"
  timeout: 135m

acc:tenant:
  extends: .acc_test
  needs:
    - job: acc:tenant_image
      optional: true
  variables:
    ACC_GROUP: "tenant"
    # Tenant deploy tests only — explicitly excludes TestAccTenantImage*
    # (RE2 has no negative lookahead, so the prefixes are enumerated).
    ACC_RUN: "^TestAccTenant(Deploy|Vlans|NoVlans|DeploymentFile|MacBlockSize|ExplicitMemory)"
    ACC_TIMEOUT: "90m"
  timeout: 105m

acc:partition:
  extends: .acc_test
  needs:
    - job: acc:tenant
      optional: true
  variables:
    ACC_GROUP: "partition"
    ACC_RUN: "^TestAccPartitionCreate"
    ACC_TIMEOUT: "30m"

acc:partition_change_password:
  extends: .acc_test
  needs:
    - job: acc:partition
      optional: true
  variables:
    ACC_GROUP: "partition_change_password"
    ACC_RUN: "^TestAccPartitionChangePassword"
    ACC_TIMEOUT: "30m"

acc:user:
  extends: .acc_test
  needs:
    - job: acc:partition_change_password
      optional: true
  variables:
    ACC_GROUP: "user"
    # User resource tests only — excludes TestAccUserPasswordChange*.
    ACC_RUN: "^TestAccUser(Resource|Role)"
    ACC_TIMEOUT: "60m"

acc:user_password_change:
  extends: .acc_test
  needs:
    - job: acc:user
      optional: true
  variables:
    ACC_GROUP: "user_password_change"
    ACC_RUN: "^TestAccUserPasswordChange"
    ACC_TIMEOUT: "30m"

# auth is the most disruptive (touches auth_order / role GIDs); run it near
# the end so a failure mid-run leaves the rest already completed.
acc:auth:
  extends: .acc_test
  needs:
    - job: acc:user_password_change
      optional: true
  variables:
    ACC_GROUP: "auth"
    ACC_RUN: "^TestAccAuth"
    ACC_TIMEOUT: "45m"

acc:proxy:
  extends: .acc_test
  needs:
    - job: acc:auth
      optional: true
  variables:
    ACC_GROUP: "proxy"
    ACC_RUN: "^TestAcc(Proxy|NoProxy)"
    ACC_TIMEOUT: "30m"

# Aggregates all per-job coverage profiles into a single combined report.
# Runs after all acceptance jobs, regardless of individual job success/failure.
acc:coverage_report:
  stage: acctest
  variables:
    GOFLAGS: "-mod=vendor"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $F5OS_HOST && $F5OS_USERNAME && $F5OS_PASSWORD
    - if: $RUN_ACC_TESTS && $F5OS_HOST && $F5OS_USERNAME && $F5OS_PASSWORD
  needs:
    - job: acc:device_info
      optional: true
      artifacts: true
    - job: acc:vlan
      optional: true
      artifacts: true
    - job: acc:interface
      optional: true
      artifacts: true
    - job: acc:lag
      optional: true
      artifacts: true
    - job: acc:dns
      optional: true
      artifacts: true
    - job: acc:ntp
      optional: true
      artifacts: true
    - job: acc:snmp
      optional: true
      artifacts: true
    - job: acc:logging
      optional: true
      artifacts: true
    - job: acc:tls_cert_key
      optional: true
      artifacts: true
    - job: acc:primarykey
      optional: true
      artifacts: true
    - job: acc:config_backup
      optional: true
      artifacts: true
    - job: acc:license
      optional: true
      artifacts: true
    - job: acc:qkview
      optional: true
      artifacts: true
    - job: acc:system
      optional: true
      artifacts: true
    - job: acc:tenant_image
      optional: true
      artifacts: true
    - job: acc:tenant
      optional: true
      artifacts: true
    - job: acc:partition
      optional: true
      artifacts: true
    - job: acc:partition_change_password
      optional: true
      artifacts: true
    - job: acc:user
      optional: true
      artifacts: true
    - job: acc:user_password_change
      optional: true
      artifacts: true
    - job: acc:auth
      optional: true
      artifacts: true
    - job: acc:proxy
      optional: true
      artifacts: true
  script:
    - |
      # Find all coverage profiles from the acceptance jobs
      profiles=$(ls cover_*.out 2>/dev/null || true)
      if [ -z "$profiles" ]; then
        echo "No coverage profiles found. All acceptance jobs may have failed."
        exit 0
      fi
      echo "Found coverage profiles:"
      ls -la cover_*.out
    - |
      # Merge all coverage profiles into a single combined profile.
      # Go coverage profiles are text: a "mode:" header line followed by
      # coverage blocks.  We emit the header once then concatenate all
      # data lines, avoiding an external dependency on gocovmerge.
      head -1 $(ls cover_*.out | head -1) > acc_cover_combined.out
      for f in cover_*.out; do
        tail -n +2 "$f" >> acc_cover_combined.out
      done
      echo "Combined coverage profile created: acc_cover_combined.out"
    - |
      # Generate human-readable coverage report
      go tool cover -func=acc_cover_combined.out > acc_coverage_report.txt
      echo ""
      echo "=== Acceptance Test Coverage Report ==="
      cat acc_coverage_report.txt
      echo ""
    - |
      # Extract and display total coverage
      COVERAGE=$(go tool cover -func=acc_cover_combined.out | tail -1 | awk '{print $NF}' | tr -d '%')
      echo "coverage: ${COVERAGE}%"
  coverage: '/coverage: \d+\.\d+/'
  artifacts:
    when: always
    paths:
      - acc_cover_combined.out
      - acc_coverage_report.txt
    expire_in: 30 days
  allow_failure: true

# ── Schema Diff ────────────────────────────────────────────────────────
# Compares the RESTCONF/YANG schemas of two F5OS devices running different
# versions and generates a Markdown report highlighting breaking changes,
# new APIs, and new properties.
#
# Runs on a schedule or when triggered manually with SCHEMA_DIFF_RUN=true.
#
# Required CI/CD variables (set in GitLab > Settings > CI/CD > Variables):
#   SCHEMA_BASE_HOST     - Base device host:port  (e.g. 10.0.0.1:8888)
#   SCHEMA_BASE_USER     - Base device username
#   SCHEMA_BASE_PASS     - Base device password    (masked, env var only)
#   SCHEMA_NEW_HOST      - New device host:port    (e.g. 10.0.0.2:8888)
#   SCHEMA_NEW_USER      - New device username
#   SCHEMA_NEW_PASS      - New device password     (masked, env var only)
#
# Note: Passwords are passed via environment variables only (not CLI flags)
# to avoid leaking credentials in the process table.
#
# Schedule setup:
#   Go to Settings > CI/CD > Pipeline schedules and create a new schedule.
#   Set the cron expression (e.g. "0 6 * * 1" for weekly Monday 6am UTC).
#   Ensure the schedule targets the default branch.
schema-diff:
  stage: schema-diff
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEMA_DIFF_RUN == "true" && $SCHEMA_BASE_HOST && $SCHEMA_NEW_HOST
    - if: $SCHEMA_DIFF_RUN == "true" && $SCHEMA_BASE_HOST && $SCHEMA_NEW_HOST
  script:
    - export GOFLAGS=-mod=vendor
    - mkdir -p build reports
    - go build -v -o build/schemadiff ./cmd/schemadiff
    # Passwords are read from env vars only — CLI flags were removed to
    # avoid leaking credentials in the process table.
    - export SCHEMA_BASE_PASS="${SCHEMA_BASE_PASS}"
    - export SCHEMA_NEW_PASS="${SCHEMA_NEW_PASS}"
    - |
      build/schemadiff \
        -base-host "${SCHEMA_BASE_HOST}" \
        -base-user "${SCHEMA_BASE_USER}" \
        -new-host  "${SCHEMA_NEW_HOST}"  \
        -new-user  "${SCHEMA_NEW_USER}"  \
        -out reports/schema_diff_report.md || DIFF_EXIT=$?
    - echo "Schema diff exited with code ${DIFF_EXIT:-0}"
    - cat reports/schema_diff_report.md
    # exit 0 so the job always succeeds (breaking changes are flagged in the report)
    # change to "exit ${DIFF_EXIT:-0}" if you want breaking changes to fail the pipeline
    - exit 0
  artifacts:
    when: always
    paths:
      - reports/schema_diff_report.md
    expire_in: 90 days

# ---------------------------------------------------------------------------
# Release & publish — mirrors .github/workflows/release.yml
#
# Triggered on tags matching v*. Builds release artifacts with goreleaser,
# then publishes them to GitHub so the Terraform Registry can pick them up.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   GPG_PRIVATE_KEY          – ASCII-armored GPG private key (file variable)
#   GITHUB_TOKEN_FOR_SYNC    – GitHub PAT with repo scope
#   GITHUB_ORG               – GitHub organisation (default: f5networks)
#   GITHUB_USER              – GitHub username for git push
#   GITHUB_MAIL              – Email for git commits to GitHub
#   RUN_RELEASE              – Set to "true" on a pipeline schedule to run
#                              the goreleaser build (snapshot mode)
#   PUBLISH_TO_GITHUB        – Set to "true" to enable the GitHub publish job
#                              (add as a pipeline schedule variable)
#   RELEASE_TAG              – Tag to publish (e.g. "v1.2.0"); required for
#                              scheduled runs of github-for-terraform-registry
#                              when CI_COMMIT_TAG is not set
# ---------------------------------------------------------------------------
goreleaser:
  stage: release
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_RELEASE == "true"
  image:
    name: "${DOCKER_HUB_PROXY}/goreleaser/goreleaser"
  variables:
    GIT_DEPTH: 0
    GITLAB_TOKEN: $CI_JOB_TOKEN
  before_script:
    - apk add gpg-agent git
    # Fail fast if GPG_PASSPHRASE is not set — without it the GPG import
    # silently fails and goreleaser produces unsigned artifacts.
    - |
      if [ -z "$GPG_PASSPHRASE" ]; then
        echo "ERROR: GPG_PASSPHRASE is not set. Add it as a CI/CD variable."
        exit 1
      fi
    # Download secure files
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash

    # Import the GPG key
    - gpg --batch --passphrase "$GPG_PASSPHRASE" --import .secure_files/private.key

    # Verify import
    - gpg --list-secret-keys
    - "export GPG_FINGERPRINT=$(gpg --with-colons --list-keys | awk -F: '/^pub/ { print $5 }')"
    # When running from a schedule, CI_COMMIT_TAG may be empty. Derive
    # the version from the latest v* tag in the repository.
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        CI_COMMIT_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)
        if [ -z "$CI_COMMIT_TAG" ]; then
          echo "ERROR: CI_COMMIT_TAG is not set and no v* tag found in the repository."
          exit 1
        fi
        export CI_COMMIT_TAG
        echo "Derived tag from git: $CI_COMMIT_TAG"
      fi
  script:
    # Tag/Schedule snapshot build (no publish).
    - |
      goreleaser release --snapshot --clean
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      cp terraform-registry-manifest.json "dist/${CI_PROJECT_NAME}_${VERSION}_manifest.json"
  artifacts:
    paths:
      - dist/*.zip
      - dist/*_SHA256SUMS*
      - dist/*_manifest.json
      - docs/

github-for-terraform-registry:
  stage: publish
  rules:
    - if: $PUBLISH_TO_GITHUB == "true" && $CI_COMMIT_TAG =~ /^v/
    - if: $PUBLISH_TO_GITHUB == "true" && $CI_PIPELINE_SOURCE == "schedule"
  image: "${DOCKER_HUB_PROXY}/alpine:3.16"
  variables:
    GIT_STRATEGY: none
    GITHUB_ORG: f5networks
    GITHUB_REPO: $CI_PROJECT_NAME
    GITHUB_USER: f5networks
  before_script:
    - apk add --update curl jq file git
    # Fail fast if critical variables are missing — without these the job
    # produces cryptic failures during git clone, GitHub API calls, or
    # generates releases with empty tags.
    - |
      missing=""
      for var in GITHUB_TOKEN_FOR_SYNC GITHUB_MAIL GITHUB_USER GITHUB_ORG; do
        eval val=\$$var
        if [ -z "$val" ]; then
          missing="$missing $var"
        fi
      done
      if [ -n "$missing" ]; then
        echo "ERROR: Required CI/CD variables are not set:$missing"
        exit 1
      fi
    # When running from a schedule, CI_COMMIT_TAG is empty. Use
    # RELEASE_TAG (a schedule variable) or extract from artifact names.
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        if [ -n "$RELEASE_TAG" ]; then
          export CI_COMMIT_TAG="$RELEASE_TAG"
        else
          CI_COMMIT_TAG=$(ls dist/*.zip 2>/dev/null | head -1 | sed 's/.*_\([0-9][^_]*\)_.*/v\1/')
          export CI_COMMIT_TAG
        fi
        if [ -z "$CI_COMMIT_TAG" ]; then
          echo "ERROR: Could not determine release tag. Set RELEASE_TAG or ensure dist/ contains release artifacts."
          exit 1
        fi
        echo "Derived tag: $CI_COMMIT_TAG"
      fi
    # Ensure dist/ actually contains release artifacts. If the goreleaser
    # job failed silently or artifacts were not passed, there is nothing
    # to publish and we should fail before creating an empty GitHub release.
    - |
      if ! ls dist/*.zip 1>/dev/null 2>&1; then
        echo "ERROR: No .zip files found in dist/. The goreleaser job may have failed or its artifacts were not passed to this job."
        exit 1
      fi
    - ls dist/
  script:
    # Push generated docs to the GitHub mirror.
    - |
      git clone --depth 1 https://$GITHUB_USER:$GITHUB_TOKEN_FOR_SYNC@github.com/$GITHUB_ORG/$GITHUB_REPO.git /tmp/github-repo
      cp -rf docs /tmp/github-repo
      cd /tmp/github-repo
      git config user.email "$GITHUB_MAIL"
      git config user.name "$GITHUB_USER"
      git add docs
      git commit --message "Update docs for $CI_COMMIT_TAG release" --allow-empty
      git push
      cd -
      rm -rf /tmp/github-repo
    # Create a pre-release on GitHub (the Terraform Registry watches for these).
    # https://docs.github.com/en/rest/releases/releases#create-a-release
    - |
      gh_release=$(curl --silent --show-error --fail-with-body \
        -X POST \
        -H "Accept: application/vnd.github.v3+json" \
        -H "Authorization: token $GITHUB_TOKEN_FOR_SYNC" \
        "https://api.github.com/repos/$GITHUB_ORG/$GITHUB_REPO/releases" \
        -d '{
          "tag_name":"'"$CI_COMMIT_TAG"'",
          "target_commitish":"main",
          "name":"'"$CI_COMMIT_TAG"'",
          "body":"This release hosted on GitHub only exists because it is the only way to publish to the Terraform Provider Registry.\n\nSee the official release page on GitLab here: **'"$CI_PROJECT_URL"'/-/releases/'"$CI_COMMIT_TAG"'**",
          "draft":false,
          "prerelease":true,
          "generate_release_notes":false
        }')
    - gh_release_id=$(echo "$gh_release" | jq -r '.id')
    - gh_release_upload_url="https://uploads.github.com/repos/$GITHUB_ORG/$GITHUB_REPO/releases/$gh_release_id/assets"
    - 'echo "GitHub Release URL: $gh_release_upload_url"'
    # Upload every release asset produced by goreleaser.
    # On failure, retry once. Track all failures so we can report them
    # after the loop completes instead of aborting on the first error.
    # https://docs.github.com/en/rest/releases/assets#upload-a-release-asset
    - |
      echo "Uploading assets from dist/ produced by goreleaser"
      failed_assets=""
      for asset in dist/*; do
        content_type=$(file -b --mime-type "$asset")
        filename=$(basename "$asset")
        uploaded=false
        for attempt in 1 2; do
          if [ "$attempt" -eq 2 ]; then
            echo "  Retrying $filename (attempt 2/2)..."
            sleep 5
          fi
          if curl --silent --output /dev/null --show-error --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN_FOR_SYNC" \
            "$gh_release_upload_url?name=$filename" \
            -H "Content-Type: $content_type" \
            --data-binary "@$asset"; then
            echo "Uploaded $filename"
            uploaded=true
            break
          fi
        done
        if [ "$uploaded" = "false" ]; then
          echo "FAILED to upload $filename after 2 attempts"
          failed_assets="$failed_assets $filename"
        fi
      done
      if [ -n "$failed_assets" ]; then
        echo ""
        echo "============================================================"
        echo "ERROR: The following assets failed to upload after 2 attempts:"
        echo " $failed_assets"
        echo ""
        echo "The GitHub release ($CI_COMMIT_TAG) remains in pre-release state."
        echo "To upload the failed assets manually and promote the release, run:"
        echo ""
        for f in $failed_assets; do
          echo "  curl -X POST -H 'Authorization: token \$GITHUB_TOKEN' \\"
          echo "    -H 'Content-Type: $(file -b --mime-type "dist/$f")' \\"
          echo "    --data-binary @dist/$f \\"
          echo "    '${gh_release_upload_url}?name=$f'"
          echo ""
        done
        echo "Then promote the release:"
        echo ""
        echo "  curl -X PATCH -H 'Authorization: token \$GITHUB_TOKEN' \\"
        echo "    -H 'Accept: application/vnd.github+json' \\"
        echo "    'https://api.github.com/repos/$GITHUB_ORG/$GITHUB_REPO/releases/$gh_release_id' \\"
        echo "    -d '{\"prerelease\":false}'"
        echo "============================================================"
        exit 1
      fi
    # Promote pre-release → release now that all assets are uploaded.
    - |
      curl --silent --show-error --fail-with-body \
        -X PATCH \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: token $GITHUB_TOKEN_FOR_SYNC" \
        "https://api.github.com/repos/$GITHUB_ORG/$GITHUB_REPO/releases/$gh_release_id" \
        -d '{"prerelease":false}'